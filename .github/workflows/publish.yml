name: Test and Publish Workspace

on:
    push:
        branches:
            - "**"

env:
    DENO_UNSTABLE_TSGO: 1

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Clone repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Lint code
              run: deno lint

            - name: Lint docs
              run: deno task lint-docs

            - name: Check publish
              run: deno publish --dry-run

            - name: Format
              run: deno task format-check

            - name: Test
              run: deno task test-coverage

            - name: Generate Coverage
              run:
                  deno coverage --exclude='tests/' --lcov --output=coverage.lcov
                  coverage/

            - name: Publish Coverage
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
    publish:
        name: Publish to JSR
        runs-on: ubuntu-slim
        needs: test
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Clone repository
              uses: actions/checkout@v6

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Publish to JSR
              run: deno publish
